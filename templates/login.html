<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Registro Académico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:#F6F7F9;">
    <div class="panel" style="width: 360px;">
        <div class="page-header" style="margin-bottom: 8px;">
            <h1>Registro Académico</h1>
            <p>Inicia sesión para administrar la base de datos.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" class="form-grid">
            <div class="field full">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required autofocus>
            </div>
            <div class="field full">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-accent" style="width:100%;">Entrar</button>
            </div>
        </form>
    </div>
</body>
</html>
